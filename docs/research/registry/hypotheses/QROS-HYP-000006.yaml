observation: 'Stylized Fact QROS-OBS-022 & Pattern QROS-PAT-006: H1 24-period breakouts
  aligned with D1 50-day trend direction produce positive 8-hour forward drift across
  non-OOS data (N=84, p = 0.012).'
hypothesis_statement: H1 24-bar high/low breakouts that strictly align with the higher-timeframe
  Daily macro trend (D1 Close > MA50) exhibit positive directional drift over an 8
  to 24 hour holding window.
plausible_rationale: Higher-timeframe macro trend alignment filters out false consolidation
  whipsaws by ensuring lower-timeframe breakout momentum flows in the direction of
  institutional macro positioning.
entry_condition: H1 Close > 24-bar High AND D1 Close > 50-Day MA (Long); H1 Close
  < 24-bar Low AND D1 Close < 50-Day MA (Short).
exit_condition: Exit after 16 H1 bars (16 hours), or trailing stop at 2.0x ATR(24).
holding_period: 8 to 24 H1 bars (8 to 24 hours)
expected_effect: Net annualized Sharpe >= 1.20, Profit Factor >= 1.30 under Class
  III swing hurdles.
null_hypothesis: 'H_0: Mean net return of trend-aligned H1 breakouts is <= 0.0.'
alternative_hypothesis: 'H_1: Mean net return of trend-aligned H1 breakouts is strictly
  > 0.0 with DSR >= 0.95.'
required_data: XAUUSD H1 and D1 aligned datasets covering continuous non-OOS history.
potential_confounders: Abrupt macro reversal days where D1 trend breaks simultaneously
  with H1 breakout.
transaction_cost_assumptions: 'Class III Profile: 20 pts spread, 2.0x slippage multiplier,
  0ms latency buffer.'
