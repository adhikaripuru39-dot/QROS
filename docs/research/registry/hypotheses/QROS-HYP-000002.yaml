hypothesis_id: QROS-HYP-000002
market: COMMODITIES
asset: XAUUSD
timeframe: H1
research_class: CLASS-III
market_condition: Consolidation regime where ATR(6) / ATR(24) < 0.60 across active
  market sessions
observation: 'Stylized Fact QROS-OBS-002, QROS-OBS-003, & QROS-OBS-007: Realized volatility
  exhibits autoregressive clustering; periods of extreme range compression (ATR6/ATR24
  < 0.60) precede persistent volatility expansion regimes.'
hypothesis_statement: Directional breakouts from a multi-hour volatility compression
  state (ATR6/ATR24 < 0.60) on H1 persist in the direction of the breakout over an
  8 to 24 hour holding window.
plausible_rationale: Consolidation traps resting stop liquidity on both sides of the
  market. Once directional momentum breaches the range boundary, cascading stop execution
  and trend-following inflows fuel multi-hour expansion.
entry_condition: H1 close breaks above the 24-hour high (or below 24-hour low) following
  at least 6 consecutive hours of ATR(6)/ATR(24) < 0.60 compression.
exit_condition: Exit after 16 H1 bars (16 hours), or upon trailing stop loss of 2.0x
  ATR(24), or when Garman-Klass volatility reaches 95th percentile.
holding_period: 8 to 24 H1 bars (8 to 24 hours)
expected_effect: Net annualized Sharpe >= 1.20, Profit Factor >= 1.30 under Class
  III 2.0x slippage stress.
null_hypothesis: 'H_0: Post-compression breakout returns do not differ from zero (E[R_net]
  <= 0).'
alternative_hypothesis: 'H_1: Post-compression breakout returns are strictly positive
  (E[R_net] > 0) with DSR >= 0.95 under multiple-testing accounting.'
required_data: XAUUSD H1 historical OHLCV covering at least 1.0 year of continuous
  non-OOS history (N >= 150 events).
potential_confounders: Whipsaw ranges during Federal Reserve FOMC blackout periods
  or holiday liquidity droughts.
transaction_cost_assumptions: 'Class III Profile: 20 pts nominal spread, 2.0x slippage
  multiplier, 0ms latency buffer.'
